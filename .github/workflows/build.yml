name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build plugins
        run: |
          cd src
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Prepare builds folder
        run: |
          mkdir builds
          cp src/**/build/*.cs3 builds/ || echo "no cs3 found"
          cp src/build/plugins.json builds/
          cp src/repo.json builds/

      - name: Push to builds branch
        run: |
          cd builds
          git init
          git checkout -b builds
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin builds --force
          
      - name: Debug structure
        run: |
          ls -R

